name: Godot integration
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  headless:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        godot: ['4.3', '4.5']
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot
        env:
          GODOT_VERSION: ${{ matrix.godot }}
        run: |
          curl --fail --location --retry 2 "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          chmod +x "/tmp/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "/tmp/godot-bin" >> "$GITHUB_PATH"
      - name: Import and test combined project
        env:
          GODOT_VERSION: ${{ matrix.godot }}
        run: |
          "Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . --import
          "Godot_v${GODOT_VERSION}-stable_linux.x86_64" --headless --path . -s res://tests/run_tests.gd
